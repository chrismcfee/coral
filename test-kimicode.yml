---
# Live smoke test for the Kimi Code agent path. Installs a REAL Paseo daemon plus Kimi Code on the
# target, as the dedicated paseo user. Run from the repo root:
#
#     ansible-playbook -i inventory.yml test-kimicode.yml --limit <host>
#     ansible-playbook -i inventory.yml test-kimicode-verify.yml --limit <host>    # then assert
#     ansible-playbook -i inventory.yml test-kimicode.yml --limit <host> --check   # later: preview a change
#
# --check is for a host that has been provisioned at least once: a dry run cannot create the
# paseo user, so on a brand-new host it stops at the first task that has to run as that user.
#
# Without a credential the CLI installs and Paseo reports it available, but the first prompt fails —
# availability does not check auth. To exercise auth end-to-end, pass the env-only credential
# (Kimi does NOT read a bare KIMI_API_KEY from the environment; KIMI_MODEL_NAME is the switch):
#     -e '{"paseo_kimicode_secrets": {"KIMI_MODEL_NAME": "kimi-for-coding",
#          "KIMI_MODEL_API_KEY": "sk-...", "KIMI_MODEL_BASE_URL": "https://api.kimi.com/coding/v1"}}'
# or log the daemon user in once on the host (OAuth, device-code flow):
#     sudo -u paseo env HOME=/var/lib/paseo /var/lib/paseo/.kimi-code/bin/kimi login
#
# Undo with ./test-local-teardown.sh on the target, or remove the paseo user + /var/lib/paseo.
- name: Paseo + Kimi Code live smoke test
  hosts: all
  become: true
  vars:
    paseo_after_netbird: false          # don't order after a netbird unit that may not be here
    paseo_relay_enabled: false
    paseo_service_enabled: false        # start now, don't auto-start on boot
    paseo_install_github_cli: false
    paseo_daemon_password: "smoke-test-only-change-me"

    # OpenCode off: this run is about the Kimi path, and leaving it on would require a
    # sanitized opencode.jsonc for the controller.
    paseo_install_opencode: false
    paseo_deploy_opencode_config: false

    paseo_install_kimicode: true
    paseo_kimicode_version: "2.7.3"     # pin, so a re-run is a genuine no-op test
  roles:
    - paseo
