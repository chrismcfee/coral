---
galaxy_info:
  role_name: editors
  namespace: homelab
  author: homelab
  description: >-
    Install Neovim and/or Emacs (optionally Doom Emacs) and deploy their configuration for one
    user, across Gentoo, Debian/Ubuntu, Fedora/RHEL and Arch. Pairs with the paseo role — it
    defaults to that role's daemon user — but has no dependency on it.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Gentoo
    - name: Debian
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
    - name: Fedora
      versions:
        - all
    - name: EL
      versions:
        - all
    - name: Archlinux
  galaxy_tags:
    - neovim
    - emacs
    - doom
    - editor
    - devenv
    - gentoo
    - fedora
    - archlinux
    - homelab

dependencies: []
