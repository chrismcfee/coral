---
# Install the Kimi Code CLI for paseo_user via Moonshot's official installer. Everything here was
# read off the installer script (code.kimi.com/kimi-code/install.sh), not assumed:
#
#  - It installs ONE real file, <KIMI_INSTALL_DIR>/bin/kimi (default ~/.kimi-code/bin/kimi) — a
#    glibc binary with no Node at runtime. Not ~/.local/bin, and not a symlink into a version store
#    the way Claude Code is laid out.
#  - It pins: KIMI_VERSION (or `--version`) selects a release; empty resolves `latest`.
#  - It verifies a sha256 from the release manifest before installing.
#  - Left alone it EDITS THE USER'S SHELL RC to add its bin dir to PATH, and renames any older
#    `kimi` it finds on PATH. KIMI_NO_MODIFY_PATH turns both off: PATH for the daemon is owned by
#    the unit (paseo_service_path), and a provisioning tool has no business rewriting ~/.bashrc.
#
# Idempotency execs `kimi --version` (about 0.4 s). There is no symlink whose target names the
# version, so unlike claude_install.yml there is nothing cheaper to read that is also truthful.

- name: Ensure bash, curl, tar + sha256sum are present (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - bash
      - curl
      - tar
      - ca-certificates
      - coreutils
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

# bash, tar and coreutils are in @system on Gentoo; curl is the only one that may be missing.
- name: Ensure curl is present (Gentoo)
  community.general.portage:
    package: net-misc/curl
    state: present
  when: ansible_os_family == 'Gentoo'

- name: Ensure bash, curl, tar + sha256sum are present (Fedora/RHEL)
  ansible.builtin.package:
    name:
      - bash
      - curl
      - tar
      - coreutils
    state: present
  when: ansible_os_family == 'RedHat'

- name: Ensure bash, curl, tar + sha256sum are present (Arch)
  community.general.pacman:
    name:
      - bash
      - curl
      - tar
      - coreutils
    state: present
  when: ansible_os_family == 'Archlinux'

# KIMI_CODE_NO_AUTO_UPDATE on every kimi the role itself runs: a version probe must never be the
# thing that kicks off a background self-update on a host we are trying to pin.
# check_mode: false — read-only, so a dry run reports the real installed version.
- name: Check the installed Kimi Code version
  ansible.builtin.command:
    argv:
      - "{{ paseo_kimicode_installed_bin }}"
      - --version
  environment:
    HOME: "{{ paseo_home_dir }}"
    KIMI_CODE_HOME: "{{ paseo_kimicode_data_dir }}"
    KIMI_CODE_NO_AUTO_UPDATE: "1"
  become: true
  become_user: "{{ paseo_user }}"
  register: _paseo_kc_ver
  changed_when: false
  failed_when: false
  check_mode: false

- name: Record the installed Kimi Code version
  ansible.builtin.set_fact:
    _paseo_kc_installed_version: >-
      {{ (_paseo_kc_ver.stdout | default('') | trim)
         if (_paseo_kc_ver.rc | default(1)) == 0 else '' }}

- name: Decide whether Kimi Code must be (re)installed
  ansible.builtin.set_fact:
    _paseo_kc_install_needed: >-
      {{ (_paseo_kc_installed_version | length == 0)
         or (paseo_kimicode_upgrade | bool)
         or ((paseo_kimicode_version | length > 0)
             and (_paseo_kc_installed_version != paseo_kimicode_version)) }}

# `set -o pipefail` so a curl failure (unreachable host, or a pinned version with no manifest) fails
# the task instead of being masked by bash's exit status. KIMI_VERSION="" means "latest" — the
# script reads ${KIMI_VERSION:-}. KIMI_CODE_HOME tells it where to drop the region marker, so that
# file lands in the same data dir the daemon's kimi will read.
- name: Install / upgrade Kimi Code (official installer)
  ansible.builtin.shell:
    cmd: "set -o pipefail; curl -fsSL {{ paseo_kimicode_install_url | quote }} | bash"
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ paseo_home_dir }}"
    PATH: "/usr/local/bin:/usr/bin:/bin"
    KIMI_VERSION: "{{ paseo_kimicode_version }}"
    KIMI_INSTALL_DIR: "{{ paseo_kimicode_install_dir }}"
    KIMI_CODE_HOME: "{{ paseo_kimicode_data_dir }}"
    KIMI_NO_MODIFY_PATH: "1"
  become: true
  become_user: "{{ paseo_user }}"
  register: _paseo_kc_install
  changed_when: _paseo_kc_install.rc == 0
  when: _paseo_kc_install_needed | bool
  notify: restart paseo

- name: Verify the Kimi Code binary is present
  ansible.builtin.stat:
    path: "{{ paseo_kimicode_installed_bin }}"
  become: true
  become_user: "{{ paseo_user }}"
  register: _paseo_kc_bin_stat

# Skipped under --check: the install task above is a no-op in check mode, so on a host that doesn't
# have Kimi Code yet this would fail the dry run rather than report the intended change.
- name: Assert Kimi Code installed
  ansible.builtin.assert:
    that:
      - _paseo_kc_bin_stat.stat.exists
      - _paseo_kc_bin_stat.stat.executable | default(false)
    fail_msg: >-
      Kimi Code binary not found at {{ paseo_kimicode_installed_bin }} after install. The installer
      needs bash, curl (or wget), sha256sum, a glibc system (musl is unsupported) and outbound
      HTTPS to the host in paseo_kimicode_install_url. Check a pinned paseo_kimicode_version
      actually exists, or re-run with -vv to see the installer's own output.
    quiet: true
  when: not ansible_check_mode

# Belt-and-suspenders alongside paseo_service_path, matching the other agents. A distinct dest per
# agent — never share one.
- name: Symlink the Kimi Code binary into /usr/local/bin
  ansible.builtin.file:
    src: "{{ paseo_kimicode_installed_bin }}"
    dest: /usr/local/bin/kimi
    state: link
    force: true
  when: paseo_kimicode_symlink | bool
